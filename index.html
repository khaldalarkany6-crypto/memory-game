<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساحة التحديات | Game Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .profile-card label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .profile-input-group {
      display: flex;
      gap: 0.5rem;
    }

    .profile-input-group input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      outline: none;
      font-size: 1rem;
    }

    .profile-input-group input:focus {
      border-color: var(--primary);
    }

    .btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.6rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.2rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .game-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .game-icon {
      font-size: 2.2rem;
      background: rgba(99, 102, 241, 0.15);
      padding: 0.6rem;
      border-radius: 0.75rem;
    }

    .game-info h2 {
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
    }

    .game-info p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .game-badge {
      align-self: flex-start;
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎮 ساحة التحديات</h1>
      <p>سجل اسمك واختر اللعبة للمنافسة في الصدارة</p>
    </header>

    <div class="profile-card">
      <label for="username">اسمك في التحدي (يُحفظ تلقائياً في كل الألعاب):</label>
      <div class="profile-input-group">
        <input type="text" id="username" placeholder="اكتب اسمك هنا..." maxlength="15">
        <button class="btn" id="save-user-btn">حفظ</button>
      </div>
    </div>

    <div class="games-grid">
      <!-- كرت لعبة الذاكرة -->
      <a href="memory/index.html" class="game-card">
        <div class="game-header">
          <div class="game-icon">🧠</div>
          <div class="game-info">
            <h2>تحدي الذاكرة</h2>
            <p>اقلب الكروت واجمع الرموز المتطابقة بأسرع وقت وأقل محاولات.</p>
          </div>
        </div>
        <span class="game-badge">أونلاين ليدربورد 🟢</span>
      </a>

      <!-- كرت لعبة سرعة رد الفعل -->
      <a href="reaction/index.html" class="game-card">
        <div class="game-header">
          <div class="game-icon">⚡</div>
          <div class="game-info">
            <h2>سرعة رد الفعل</h2>
            <p>اختبر سرعة استجابتك بالملي ثانية بمجرد تحول الشاشة للأخضر.</p>
          </div>
        </div>
        <span class="game-badge">أونلاين ليدربورد 🟢</span>
      </a>
    </div>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const saveBtn = document.getElementById('save-user-btn');

    const savedName = localStorage.getItem('player_nickname') || '';
    usernameInput.value = savedName;

    saveBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name) {
        localStorage.setItem('player_nickname', name);
        alert('تم حفظ اسمك بنجاح! الآن ادخل أي لعبة وتنافس.');
      }
    });
  </script>
</body>
</html>
