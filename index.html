<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي الذاكرة أونلاين | لوحة الصدارة</title>
  
  <!-- استدعاء Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-back: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .dashboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.85rem;
      border-radius: 1rem;
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
      width: 100%;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
      border-radius: 0.85rem;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg) scale(0.96);
      pointer-events: none;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-border);
    }

    .card-front {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: var(--primary);
      font-size: 1.6rem;
    }

    .card-back {
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      transform: rotateY(180deg);
      font-size: 2.2rem;
      border-color: #4f46e5;
    }

    .card.matched .card-back {
      background: linear-gradient(135deg, #064e3b, #022c22);
      border-color: var(--accent-green);
    }

    .card.mismatch {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-5px); }
      75% { transform: rotateY(180deg) translateX(5px); }
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #334155;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    /* ليدربورد الأونلاين */
    .leaderboard-section {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1rem;
    }

    .leaderboard-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-badge {
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.6rem 0.85rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
    }

    .leaderboard-rank {
      font-weight: bold;
      width: 30px;
    }

    .leaderboard-name {
      flex: 1;
      font-weight: 600;
      margin-right: 0.5rem;
      word-break: break-word;
    }

    .leaderboard-score {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* نافذة الفوز */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.75rem;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    .modal-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      border: 1px solid var(--card-border);
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      margin: 1rem 0;
      text-align: center;
      outline: none;
    }

    .modal-box input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>تحدي الذاكرة</h1>
      <p>مين الأسرع في التحدي؟ 👀⚡</p>
    </header>

    <div class="dashboard">
      <div>
        <span class="stat-label">الوقت</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>
      <div>
        <span class="stat-label">المحاولات</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div>
        <span class="stat-label">المتطابقة</span>
        <span class="stat-value" id="matches">0 / 8</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="actions">
      <button class="btn" id="restart-btn">إعادة اللعب 🔄</button>
    </div>

    <div class="leaderboard-section">
      <div class="leaderboard-title">
        <span>🏆 الصدارة المباشرة</span>
        <span class="live-badge">🟢 متصل ومباشر</span>
      </div>
      <ul class="leaderboard-list" id="leaderboard-list">
        <li style="color: var(--text-muted); text-align: center; padding: 0.5rem;">جاري جلب النتائج...</li>
      </ul>
    </div>
  </div>

  <div class="modal-overlay" id="win-modal">
    <div class="modal-box">
      <div style="font-size: 3rem;">🏆</div>
      <h2 style="margin: 0.5rem 0;">كفو! جبتها</h2>
      <p id="win-summary" style="color: var(--text-muted); font-size: 0.9rem;"></p>
      
      <input type="text" id="player-name" placeholder="اكتب اسمك هنا..." maxlength="15" />
      
      <button class="btn" id="save-score-btn" style="width: 100%; margin-bottom: 0.5rem;">سجل نتيجتك أونلاين 🌐</button>
      <button class="btn btn-secondary" id="skip-btn" style="width: 100%;">تخطي والعب من جديد</button>
    </div>
  </div>

  <script>
    // بيانات الـ Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyDdVdHWz1N62VUCaMvaHhN9KFm8SpqKsqM",
      authDomain: "memory-game-2f2d4.firebaseapp.com",
      databaseURL: "https://memory-game-2f2d4-default-rtdb.firebaseio.com",
      projectId: "memory-game-2f2d4",
      storageBucket: "memory-game-2f2d4.firebasestorage.app",
      messagingSenderId: "234692589834",
      appId: "1:234692589834:web:ef0a831a3b71f7273062f3",
      measurementId: "G-X3V9MP6LS5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoresRef = db.ref('leaderboard');

    const EMOJIS = ['🚀', '🎮', '💎', '🔥', '⚡', '🍕', '👑', '🌟'];
    const grid = document.getElementById('grid');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const matchesEl = document.getElementById('matches');
    const restartBtn = document.getElementById('restart-btn');
    const winModal = document.getElementById('win-modal');
    const winSummary = document.getElementById('win-summary');
    const playerNameInput = document.getElementById('player-name');
    const saveScoreBtn = document.getElementById('save-score-btn');
    const skipBtn = document.getElementById('skip-btn');
    const leaderboardList = document.getElementById('leaderboard-list');

    let flippedCards = [];
    let moves = 0;
    let matches = 0;
    let timer = null;
    let secondsElapsed = 0;
    let isLocked = false;
    let gameStarted = false;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startTimer() {
      if (timer) clearInterval(timer);
      secondsElapsed = 0;
      timer = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function initGame() {
      clearInterval(timer);
      timerEl.textContent = '00:00';
      secondsElapsed = 0;
      gameStarted = false;
      moves = 0;
      matches = 0;
      flippedCards = [];
      isLocked = false;
      movesEl.textContent = '0';
      matchesEl.textContent = `0 / ${EMOJIS.length}`;
      winModal.classList.remove('active');
      saveScoreBtn.disabled = false;
      saveScoreBtn.textContent = 'سجل نتيجتك أونلاين 🌐';
      playerNameInput.value = '';
      grid.innerHTML = '';

      const deck = shuffle([...EMOJIS, ...EMOJIS]);
      deck.forEach(emoji => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.emoji = emoji;
        card.innerHTML = `
          <div class="card-face card-front">❓</div>
          <div class="card-face card-back">${emoji}</div>
        `;
        card.addEventListener('click', () => onCardClick(card));
        grid.appendChild(card);
      });
    }

    function onCardClick(card) {
      if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      if (!gameStarted) {
        startTimer();
        gameStarted = true;
      }

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [c1, c2] = flippedCards;

      if (c1.dataset.emoji === c2.dataset.emoji) {
        setTimeout(() => {
          c1.classList.add('matched');
          c2.classList.add('matched');
          matches++;
          matchesEl.textContent = `${matches} / ${EMOJIS.length}`;
          flippedCards = [];
          isLocked = false;

          if (matches === EMOJIS.length) {
            handleWin();
          }
        }, 300);
      } else {
        setTimeout(() => {
          c1.classList.add('mismatch');
          c2.classList.add('mismatch');
          setTimeout(() => {
            c1.classList.remove('flipped', 'mismatch');
            c2.classList.remove('flipped', 'mismatch');
            flippedCards = [];
            isLocked = false;
          }, 350);
        }, 400);
      }
    }

    function handleWin() {
      clearInterval(timer);
      winSummary.textContent = `أنهيت اللعبة بـ ${moves} محاولة وخلال ${secondsElapsed} ثانية!`;
      winModal.classList.add('active');
      playerNameInput.focus();
    }

    saveScoreBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim() || 'لاعب مجهول';
      saveScoreBtn.disabled = true;
      saveScoreBtn.textContent = 'جاري الحفظ...';

      scoresRef.push({
        name: name,
        time: secondsElapsed,
        moves: moves,
        timestamp: Date.now()
      }).then(() => {
        initGame();
      }).catch(err => {
        alert('تأكد أنك فعلت وضع Test Mode في Firebase Rules!');
        saveScoreBtn.disabled = false;
        saveScoreBtn.textContent = 'حاول مجدداً';
      });
    });

    // جلب الترتيب من Firebase مباشرة
    scoresRef.on('value', (snapshot) => {
      const data = snapshot.val();
      leaderboardList.innerHTML = '';

      if (!data) {
        leaderboardList.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 0.5rem;">لا توجد أرقام مسجلة بعد، كن أول فائز!</li>';
        return;
      }

      const list = Object.values(data);
      list.sort((a, b) => a.time - b.time || a.moves - b.moves);
      const top10 = list.slice(0, 10);

      const medals = ['🥇', '🥈', '🥉'];
      top10.forEach((item, index) => {
        const rank = medals[index] || `#${index + 1}`;
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span class="leaderboard-rank">${rank}</span>
          <span class="leaderboard-name">${item.name}</span>
          <span class="leaderboard-score">⏱️ ${item.time} ث | 🎯 ${item.moves} نقرة</span>
        `;
        leaderboardList.appendChild(li);
      });
    });

    skipBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
