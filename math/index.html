<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرياضيات السريعة | Speed Math</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      background: rgba(30, 41, 59, 0.7);
      padding: 0.85rem;
      border-radius: 1rem;
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }

    .math-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .equation {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      direction: ltr;
    }

    .answer-buttons {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .ans-btn {
      flex: 1;
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s ease;
    }

    .ans-btn:active {
      transform: scale(0.96);
    }

    .btn-correct { background-color: var(--green); }
    .btn-wrong { background-color: var(--red); }

    .btn-start {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 0.75rem;
      cursor: pointer;
    }

    .leaderboard-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1rem;
    }

    .leaderboard-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-badge {
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.6rem 0.85rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="../index.html" class="back-link">← العودة للرئيسية</a>
      <span style="font-weight: 600; color: var(--text-muted);">الرياضيات السريعة 🧠</span>
    </div>

    <div class="dashboard">
      <div>
        <span class="stat-label">الوقت المتبقي</span>
        <span class="stat-value" id="timer">30s</span>
      </div>
      <div>
        <span class="stat-label">النقاط</span>
        <span class="stat-value" id="score">0</span>
      </div>
    </div>

    <div class="math-card">
      <div class="equation" id="eq-text">جاهز؟</div>
      
      <div class="answer-buttons" id="actions-group" style="display: none;">
        <button class="ans-btn btn-correct" id="correct-btn">صح ✔️</button>
        <button class="ans-btn btn-wrong" id="wrong-btn">خطأ ✖️</button>
      </div>

      <button class="btn-start" id="start-btn">ابدأ التحدي (30 ثانية) 🚀</button>
    </div>

    <div class="leaderboard-section">
      <div class="leaderboard-title">
        <span>🏆 الصدارة المباشرة (أعلى النقاط)</span>
        <span class="live-badge">🟢 متصل ومباشر</span>
      </div>
      <ul class="leaderboard-list" id="leaderboard-list">
        <li style="color: var(--text-muted); text-align: center; padding: 0.5rem;">جاري جلب النتائج...</li>
      </ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDdVdHWz1N62VUCaMvaHhN9KFm8SpqKsqM",
      authDomain: "memory-game-2f2d4.firebaseapp.com",
      databaseURL: "https://memory-game-2f2d4-default-rtdb.firebaseio.com",
      projectId: "memory-game-2f2d4",
      storageBucket: "memory-game-2f2d4.firebasestorage.app",
      messagingSenderId: "234692589834",
      appId: "1:234692589834:web:ef0a831a3b71f7273062f3",
      measurementId: "G-X3V9MP6LS5"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoresRef = db.ref('math_leaderboard');

    const eqText = document.getElementById('eq-text');
    const actionsGroup = document.getElementById('actions-group');
    const startBtn = document.getElementById('start-btn');
    const timerEl = document.getElementById('timer');
    const scoreEl = document.getElementById('score');
    const correctBtn = document.getElementById('correct-btn');
    const wrongBtn = document.getElementById('wrong-btn');
    const leaderboardList = document.getElementById('leaderboard-list');

    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let currentActualIsCorrect = true;

    function generateEquation() {
      const ops = ['+', '-', '×'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let n1 = Math.floor(Math.random() * 20) + 1;
      let n2 = Math.floor(Math.random() * 20) + 1;
      let realResult = 0;

      if (op === '+') realResult = n1 + n2;
      else if (op === '-') {
        if (n1 < n2) [n1, n2] = [n2, n1];
        realResult = n1 - n2;
      } else {
        n1 = Math.floor(Math.random() * 10) + 1;
        n2 = Math.floor(Math.random() * 9) + 2;
        realResult = n1 * n2;
      }

      currentActualIsCorrect = Math.random() > 0.45;
      let displayedResult = realResult;

      if (!currentActualIsCorrect) {
        const offset = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1);
        displayedResult = realResult + offset;
        if (displayedResult === realResult) displayedResult += 2;
      }

      eqText.textContent = `${n1} ${op} ${n2} = ${displayedResult}`;
    }

    startBtn.addEventListener('click', () => {
      score = 0;
      timeLeft = 30;
      scoreEl.textContent = '0';
      timerEl.textContent = '30s';
      startBtn.style.display = 'none';
      actionsGroup.style.display = 'flex';

      generateEquation();

      timerId = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft + 's';
        if (timeLeft <= 0) {
          clearInterval(timerId);
          finishGame();
        }
      }, 1000);
    });

    function handleAnswer(userChoice) {
      if (userChoice === currentActualIsCorrect) {
        score++;
      } else {
        score = Math.max(0, score - 1);
      }
      scoreEl.textContent = score;
      generateEquation();
    }

    correctBtn.addEventListener('click', () => handleAnswer(true));
    wrongBtn.addEventListener('click', () => handleAnswer(false));

    function finishGame() {
      actionsGroup.style.display = 'none';
      startBtn.style.display = 'block';
      startBtn.textContent = 'العب مرة ثانية 🔄';
      eqText.textContent = `انتهى! مجموعك: ${score}`;

      const playerName = localStorage.getItem('player_nickname') || 'لاعب مجهول';
      scoresRef.push({
        name: playerName,
        score: score,
        timestamp: Date.now()
      });
    }

    // استماع مباشر لنتائج الحساب
    scoresRef.on('value', (snapshot) => {
      const data = snapshot.val();
      leaderboardList.innerHTML = '';
      if (!data) {
        leaderboardList.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 0.5rem;">لا توجد أرقام مسجلة بعد</li>';
        return;
      }

      const list = Object.values(data);
      list.sort((a, b) => b.score - a.score);
      const top10 = list.slice(0, 10);

      const medals = ['🥇', '🥈', '🥉'];
      top10.forEach((item, index) => {
        const rank = medals[index] || `#${index + 1}`;
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span style="font-weight: bold; width: 30px;">${rank}</span>
          <span style="flex: 1; font-weight: 600;">${item.name}</span>
          <span style="color: var(--text-muted); font-weight: bold;">🎯 ${item.score} نقطة</span>
        `;
        leaderboardList.appendChild(li);
      });
    });
  </script>
</body>
</html>
