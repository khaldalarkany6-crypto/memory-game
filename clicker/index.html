<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي سرعة النقر | 10s Click Test</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      background: rgba(30, 41, 59, 0.7);
      padding: 0.85rem;
      border-radius: 1rem;
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }

    /* زر النقر الكبير */
    .click-target {
      width: 100%;
      height: 250px;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
      transition: transform 0.05s ease, background 0.1s ease;
    }

    .click-target:active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #312e81, #1e1b4b);
    }

    .click-target h2 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .click-target p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
    }

    .leaderboard-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1rem;
    }

    .leaderboard-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-badge {
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.6rem 0.85rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="../index.html" class="back-link">← العودة للرئيسية</a>
      <span style="font-weight: 600; color: var(--text-muted);">سرعة النقر ⚡</span>
    </div>

    <div class="dashboard">
      <div>
        <span class="stat-label">الوقت المتبقي</span>
        <span class="stat-value" id="timer">10.0s</span>
      </div>
      <div>
        <span class="stat-label">مجموع النقرات</span>
        <span class="stat-value" id="score">0</span>
      </div>
    </div>

    <div class="click-target" id="tap-btn">
      <h2 id="btn-text">انقر للبدء 🔥</h2>
      <p id="btn-subtext">معك 10 ثوانٍ لجلب أعلى رقم!</p>
    </div>

    <button class="btn" id="reset-btn" style="display: none;">إعادة المحاولة 🔄</button>

    <div class="leaderboard-section">
      <div class="leaderboard-title">
        <span>🏆 الصدارة المباشرة (الأعلى نقرات)</span>
        <span class="live-badge">🟢 متصل ومباشر</span>
      </div>
      <ul class="leaderboard-list" id="leaderboard-list">
        <li style="color: var(--text-muted); text-align: center; padding: 0.5rem;">جاري جلب النتائج...</li>
      </ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDdVdHWz1N62VUCaMvaHhN9KFm8SpqKsqM",
      authDomain: "memory-game-2f2d4.firebaseapp.com",
      databaseURL: "https://memory-game-2f2d4-default-rtdb.firebaseio.com",
      projectId: "memory-game-2f2d4",
      storageBucket: "memory-game-2f2d4.firebasestorage.app",
      messagingSenderId: "234692589834",
      appId: "1:234692589834:web:ef0a831a3b71f7273062f3",
      measurementId: "G-X3V9MP6LS5"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoresRef = db.ref('clicker_leaderboard');

    const tapBtn = document.getElementById('tap-btn');
    const btnText = document.getElementById('btn-text');
    const btnSubtext = document.getElementById('btn-subtext');
    const timerEl = document.getElementById('timer');
    const scoreEl = document.getElementById('score');
    const resetBtn = document.getElementById('reset-btn');
    const leaderboardList = document.getElementById('leaderboard-list');

    let clicks = 0;
    let timeLeft = 10.0;
    let timerId = null;
    let isRunning = false;
    let isFinished = false;

    tapBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isFinished) return;

      if (!isRunning) {
        isRunning = true;
        clicks = 1;
        scoreEl.textContent = clicks;
        btnText.textContent = 'أسرررع! 🚀';
        btnSubtext.textContent = 'اضغط بأقصى سرعة!';

        timerId = setInterval(() => {
          timeLeft = +(timeLeft - 0.1).toFixed(1);
          if (timeLeft <= 0) {
            timeLeft = 0;
            finishGame();
          }
          timerEl.textContent = timeLeft.toFixed(1) + 's';
        }, 100);
      } else {
        clicks++;
        scoreEl.textContent = clicks;
      }
    });

    function finishGame() {
      clearInterval(timerId);
      isRunning = false;
      isFinished = true;
      const cps = (clicks / 10).toFixed(1);
      btnText.textContent = `${clicks} نقرة! 🎉`;
      btnSubtext.textContent = `معدل السرعة: ${cps} نقرة بالثانية`;
      resetBtn.style.display = 'block';

      const playerName = localStorage.getItem('player_nickname') || 'لاعب مجهول';
      scoresRef.push({
        name: playerName,
        clicks: clicks,
        cps: parseFloat(cps),
        timestamp: Date.now()
      });
    }

    resetBtn.addEventListener('click', () => {
      clicks = 0;
      timeLeft = 10.0;
      isRunning = false;
      isFinished = false;
      scoreEl.textContent = '0';
      timerEl.textContent = '10.0s';
      btnText.textContent = 'انقر للبدء 🔥';
      btnSubtext.textContent = 'معك 10 ثوانٍ لجلب أعلى رقم!';
      resetBtn.style.display = 'none';
    });

    // استماع مباشر للنتائج (الأعلى نقرات هو الأول)
    scoresRef.on('value', (snapshot) => {
      const data = snapshot.val();
      leaderboardList.innerHTML = '';
      if (!data) {
        leaderboardList.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 0.5rem;">لا توجد أرقام مسجلة بعد</li>';
        return;
      }

      const list = Object.values(data);
      list.sort((a, b) => b.clicks - a.clicks);
      const top10 = list.slice(0, 10);

      const medals = ['🥇', '🥈', '🥉'];
      top10.forEach((item, index) => {
        const rank = medals[index] || `#${index + 1}`;
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span style="font-weight: bold; width: 30px;">${rank}</span>
          <span style="flex: 1; font-weight: 600;">${item.name}</span>
          <span style="color: var(--text-muted); font-weight: bold;">⚡ ${item.clicks} نقرة (${item.cps} CPS)</span>
        `;
        leaderboardList.appendChild(li);
      });
    });
  </script>
</body>
</html>
